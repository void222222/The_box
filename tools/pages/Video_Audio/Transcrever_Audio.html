<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thebox · Transcritor Universal (áudio/vídeo → texto)</title>
    <!-- Headers obrigatórios para SharedArrayBuffer (FFmpeg) -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; padding: 2rem 1rem; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; }
        header { text-align: center; padding: 1rem 1rem 2rem; color: white; }
        header h1 { font-size: 2.8rem; font-weight: 700; background: linear-gradient(135deg, #c084fc, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
        header p { color: #cbd5e1; font-size: 1.1rem; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); border-radius: 32px; padding: 2rem; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 25px 40px -12px black; }
        .upload-area { border: 2px dashed rgba(255,255,255,0.1); border-radius: 30px; padding: 2rem; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.2); margin-bottom: 1.5rem; }
        .upload-area:hover { border-color: #a855f7; }
        .upload-area i { font-size: 3rem; color: #a855f7; margin-bottom: 0.5rem; }
        .upload-area p { color: #94a3b8; }
        #fileInput { display: none; }
        .file-info { background: rgba(0,0,0,0.2); border-radius: 40px; padding: 0.8rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; border: 1px solid rgba(255,255,255,0.1); }
        .file-info i { color: #a855f7; font-size: 1.2rem; }
        .file-info span { color: #cbd5e1; font-size: 0.95rem; word-break: break-all; }
        .options { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
        .options button { flex: 1; min-width: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; padding: 0.8rem 1.5rem; border-radius: 40px; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .options button:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: #a855f7; }
        .options button:disabled { opacity: 0.5; cursor: not-allowed; }
        .record-btn.recording { background: #ef4444; color: white; border-color: #ef4444; }
        .progress-area { margin-top: 1.5rem; display: none; }
        .progress-bar { width: 100%; height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-bottom: 0.5rem; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #a855f7, #d946ef); transition: width 0.3s ease; }
        .status { text-align: center; color: #94a3b8; font-size: 0.95rem; min-height: 2rem; margin-top: 0.5rem; }
        .result-area { margin-top: 2rem; background: rgba(0,0,0,0.3); border-radius: 24px; padding: 1.5rem; display: none; }
        .result-text { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 1.5rem; color: #f1f5f9; font-size: 1rem; line-height: 1.6; white-space: pre-wrap; max-height: 400px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .action-buttons { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end; }
        .action-buttons button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; padding: 0.6rem 1.2rem; border-radius: 30px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .action-buttons button:hover { background: rgba(255,255,255,0.15); }
        footer { text-align: center; padding: 2rem 1rem 0; color: #64748b; }
        .note { font-size: 0.85rem; color: #94a3b8; margin-top: 1rem; text-align: center; }
    </style>
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Carregador dinâmico do FFmpeg com fallback (remove a tag estática) -->
    <script>
        window.FFmpeg = null; // placeholder

        function loadFFmpegScript() {
            return new Promise((resolve, reject) => {
                const urls = [
                    'https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js',
                    'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/ffmpeg.min.js',
                    'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js' // versão mais recente
                ];

                function tryNext(index) {
                    if (index >= urls.length) {
                        reject(new Error('Todas as tentativas de carregar o FFmpeg falharam.'));
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = urls[index];
                    script.onload = () => {
                        if (typeof FFmpeg !== 'undefined') {
                            resolve();
                        } else {
                            tryNext(index + 1);
                        }
                    };
                    script.onerror = () => tryNext(index + 1);
                    document.head.appendChild(script);
                }

                tryNext(0);
            });
        }

        window.loadFFmpegScript = loadFFmpegScript;
    </script>
</head>
<body>
<div class="container">
    <header>
        <h1>🎙️ Transcritor Universal</h1>
        <p>Qualquer áudio/vídeo → texto. Processamento 100% local.</p>
    </header>

    <div class="card">
        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Clique ou arraste um arquivo (áudio ou vídeo)</p>
        </div>
        <input type="file" id="fileInput" accept="audio/*,video/*">

        <div id="fileInfo" class="file-info" style="display: none;">
            <i class="fas fa-file-audio"></i>
            <span id="fileName"></span>
        </div>

        <div class="options">
            <button id="transcribeBtn" disabled><i class="fas fa-play"></i> Transcrever</button>
            <button id="recordBtn" class="record-btn"><i class="fas fa-microphone"></i> Gravar áudio</button>
        </div>

        <div class="progress-area" id="progressArea">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status" id="status"></div>
        </div>

        <div class="result-area" id="resultArea">
            <div class="result-text" id="transcription"></div>
            <div class="action-buttons">
                <button id="copyBtn"><i class="fas fa-copy"></i> Copiar</button>
                <button id="clearBtn"><i class="fas fa-eraser"></i> Limpar</button>
            </div>
        </div>
    </div>

    <footer>
        <p>🔒 Conversão com FFmpeg + Transcrição com Whisper. Tudo no seu dispositivo.</p>
        <p class="note">📹 Vídeos de qualquer formato são convertidos automaticamente.</p>
    </footer>
</div>

<script type="module">
    // ========== Importar Transformers.js como módulo ==========
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';

    // ========== Código principal ==========
    (function() {
        // Elementos DOM
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameSpan = document.getElementById('fileName');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const recordBtn = document.getElementById('recordBtn');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        const transcriptionDiv = document.getElementById('transcription');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Variáveis de estado
        let inputFile = null;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let transcriber = null;
        let modelLoading = false;
        let ffmpeg = null;

        // Utilitários
        function updateStatus(msg, percent) {
            statusDiv.innerText = msg;
            if (percent !== undefined) {
                progressFill.style.width = percent + '%';
            }
        }

        // Carregar FFmpeg com garantia de que o script global foi carregado
        async function loadFFmpeg() {
            if (ffmpeg) return ffmpeg;

            // Se a variável global FFmpeg ainda não existe, carrega o script dinamicamente
            if (typeof FFmpeg === 'undefined') {
                updateStatus('Carregando FFmpeg (script)...', 5);
                try {
                    await window.loadFFmpegScript();
                } catch (error) {
                    throw new Error('Falha ao carregar o FFmpeg: ' + error.message);
                }
            }

            updateStatus('Inicializando FFmpeg...', 8);
            const { createFFmpeg, fetchFile } = FFmpeg; // agora deve estar definido

            // Tenta carregar o core do jsDelivr primeiro, com fallback para unpkg
            const coreUrls = [
                'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.7/dist/ffmpeg-core.js',
                'https://unpkg.com/@ffmpeg/core@0.12.7/dist/ffmpeg-core.js'
            ];

            let ffmpegInstance = null;
            let lastError = null;

            for (const coreUrl of coreUrls) {
                try {
                    ffmpegInstance = createFFmpeg({ 
                        log: false,
                        corePath: coreUrl
                    });
                    await ffmpegInstance.load();
                    ffmpeg = ffmpegInstance;
                    updateStatus('FFmpeg pronto', 10);
                    return { ffmpeg, fetchFile };
                } catch (error) {
                    console.warn(`Falha ao carregar FFmpeg core de ${coreUrl}:`, error);
                    lastError = error;
                    // Continua para a próxima URL
                }
            }

            // Se todas falharem, lança erro
            throw new Error('Não foi possível carregar o FFmpeg. Tente novamente mais tarde. Detalhes: ' + (lastError ? lastError.message : 'desconhecido'));
        }

        // Carregar Whisper (usando pipeline importado)
        async function loadTranscriber() {
            if (transcriber) return transcriber;
            if (modelLoading) return;
            modelLoading = true;
            progressArea.style.display = 'block';
            updateStatus('Carregando modelo Whisper... (primeira vez pode demorar)', 15);
            try {
                transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
                    progress_callback: (progress) => {
                        if (progress.status === 'progress' && progress.progress) {
                            const percent = 15 + Math.round(progress.progress * 70);
                            updateStatus(`Baixando modelo: ${Math.round(progress.progress * 100)}%`, percent);
                        }
                    }
                });
                updateStatus('Modelo carregado!', 85);
                return transcriber;
            } catch (error) {
                console.error(error);
                updateStatus('Erro no modelo: ' + error.message, 0);
                throw error;
            } finally {
                modelLoading = false;
            }
        }

        // Upload
        function handleFile(file) {
            inputFile = file;
            fileNameSpan.innerText = file.name;
            fileInfo.style.display = 'flex';
            transcribeBtn.disabled = false;
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#a855f7';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(255,255,255,0.1)';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255,255,255,0.1)';
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // Gravação
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const file = new File([audioBlob], 'gravacao.webm', { type: 'audio/webm' });
                        handleFile(file);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordBtn.innerHTML = '<i class="fas fa-stop"></i> Parar gravação';
                } catch (error) {
                    alert('Microfone não disponível: ' + error.message);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerHTML = '<i class="fas fa-microphone"></i> Gravar áudio';
            }
        });

        // Conversão com FFmpeg
        async function convertToWav(file) {
            const { ffmpeg: ff, fetchFile } = await loadFFmpeg();

            const inputName = 'input_' + Date.now() + '_' + file.name;
            ff.FS('writeFile', inputName, await fetchFile(file));

            updateStatus('Convertendo áudio... (FFmpeg)', 40);

            await ff.run(
                '-i', inputName,
                '-vn',
                '-acodec', 'pcm_s16le',
                '-ac', '1',
                '-ar', '16000',
                '-y',
                'output.wav'
            );

            const data = ff.FS('readFile', 'output.wav');
            const wavBlob = new Blob([data.buffer], { type: 'audio/wav' });

            ff.FS('unlink', inputName);
            ff.FS('unlink', 'output.wav');

            return wavBlob;
        }

        // Transcrição principal
        transcribeBtn.addEventListener('click', async () => {
            if (!inputFile) return;

            transcribeBtn.disabled = true;
            progressArea.style.display = 'block';
            updateStatus('Iniciando...', 5);

            try {
                const transcriberPromise = loadTranscriber();
                updateStatus('Convertendo arquivo...', 20);
                const wavBlob = await convertToWav(inputFile);

                const transcriberInstance = await transcriberPromise;

                updateStatus('Decodificando áudio...', 70);
                const arrayBuffer = await wavBlob.arrayBuffer();
                const audioContext = new AudioContext({ sampleRate: 16000 });
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const audioData = audioBuffer.getChannelData(0); // mono

                updateStatus('Transcrevendo...', 80);
                const output = await transcriberInstance(audioData, {
                    language: 'portuguese',
                    task: 'transcribe',
                    return_timestamps: false
                });

                updateStatus('Finalizando...', 95);
                transcriptionDiv.innerText = output.text;
                resultArea.style.display = 'block';
                updateStatus('Transcrição concluída!', 100);
                setTimeout(() => {
                    progressArea.style.display = 'none';
                }, 1000);

            } catch (error) {
                console.error(error);
                updateStatus('Erro: ' + error.message, 0);
            } finally {
                transcribeBtn.disabled = false;
            }
        });

        // Ações
        copyBtn.addEventListener('click', () => {
            const text = transcriptionDiv.innerText;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                alert('Texto copiado!');
            }).catch(() => {
                alert('Copie manualmente.');
            });
        });

        clearBtn.addEventListener('click', () => {
            inputFile = null;
            fileInfo.style.display = 'none';
            fileNameSpan.innerText = '';
            transcribeBtn.disabled = true;
            resultArea.style.display = 'none';
            transcriptionDiv.innerText = '';
            progressArea.style.display = 'none';
            statusDiv.innerText = '';
            progressFill.style.width = '0%';
        });

        // Verifica suporte a SharedArrayBuffer
        if (typeof SharedArrayBuffer === 'undefined') {
            statusDiv.innerText = '⚠️ Seu navegador não suporta SharedArrayBuffer. FFmpeg pode não funcionar.';
        }
    })();
</script>
</body>
</html>
