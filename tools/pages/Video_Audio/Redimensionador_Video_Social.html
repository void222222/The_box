<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thebox · redimensionar vídeo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="/logo_the_box_luz_e_sombra_sem_fundo-removebg-preview.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        /* Header com logo */
        header {
            text-align: center;
            padding: 1rem 1rem 2rem;
            color: white;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.1rem;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            background-color: #2d1b4e;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.1rem;
            color: #cbd5e1;
        }

        /* Card principal (ferramenta) */
        .tool-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.6);
            margin-top: 1rem;
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tool-icon {
            font-size: 2rem;
            background: rgba(255,255,255,0.03);
            padding: 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            color: #ef4444; /* vermelho de video */
        }

        .tool-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Área de upload */
        .upload-area {
            background: rgba(15, 23, 42, 0.5);
            border: 2px dashed #334155;
            border-radius: 24px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border 0.2s, background 0.2s;
            margin-bottom: 2rem;
        }

        .upload-area:hover {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.05);
        }

        .upload-area i {
            font-size: 3rem;
            color: #60a5fa;
            margin-bottom: 1rem;
        }

        .upload-area p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .upload-area .filename {
            color: #cbd5e1;
            font-weight: 500;
            margin-top: 0.5rem;
            word-break: break-word;
        }

        /* Opções de redimensionamento */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .format-group {
            flex: 1 1 200px;
        }

        .format-group label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .format-select, .quality-select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
            cursor: pointer;
        }

        .format-select:hover, .quality-select:hover {
            border-color: #60a5fa;
        }

        .format-select option, .quality-select option {
            background: #1e293b;
            color: #f1f5f9;
        }

        /* Botões */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0 1rem;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #60a5fa);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }

        .btn:not(.btn-primary):hover {
            background: rgba(255,255,255,0.15);
            border-color: #60a5fa;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Status / progresso */
        .status {
            text-align: center;
            color: #94a3b8;
            margin: 1rem 0;
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin: 0.5rem 0 1rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #60a5fa);
            transition: width 0.2s;
        }

        /* Preview */
        .preview {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .preview-box {
            flex: 1 1 250px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid #334155;
        }

        .preview-box h4 {
            color: #cbd5e1;
            margin-bottom: 1rem;
            font-weight: 500;
            text-align: center;
        }

        .preview video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        /* Link voltar */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            margin: 2rem 0 1rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #60a5fa;
        }

        footer {
            text-align: center;
            padding: 3rem 1rem 1rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header igual ao index -->
        <header>
            <div class="logo-container">
                <img src="/logo_the_box_luz_e_sombra_sem_fundo-removebg-preview.png" alt="thebox" class="logo-img">
            </div>
            <h1>thebox</h1>
            <p>Redimensionar vídeo para redes sociais</p>
        </header>

        <!-- Card da ferramenta -->
        <div class="tool-card">
            <div class="tool-header">
                <div class="tool-icon"><i class="fas fa-crop-alt"></i></div>
                <h2>Redimensionador Social</h2>
            </div>

            <!-- Upload -->
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Clique ou arraste um vídeo aqui</p>
                <p style="font-size:0.85rem; color:#64748b;">MP4, MOV, WebM (até 200MB)</p>
                <div class="filename" id="fileName"></div>
                <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm" style="display: none;">
            </div>

            <!-- Opções de formato -->
            <div class="options">
                <div class="format-group">
                    <label><i class="fas fa-crop" style="margin-right:6px;"></i> Formato</label>
                    <select class="format-select" id="formatSelect">
                        <option value="9:16">Story / Reels / TikTok (9:16)</option>
                        <option value="1:1">Feed quadrado (1:1)</option>
                        <option value="16:9">Widescreen (16:9)</option>
                        <option value="4:5">Retrato (4:5)</option>
                    </select>
                </div>
                <div class="format-group">
                    <label><i class="fas fa-sliders-h" style="margin-right:6px;"></i> Ajuste</label>
                    <select class="quality-select" id="fitSelect">
                        <option value="contain">Manter tudo (barras)</option>
                        <option value="cover">Cortar para preencher</option>
                    </select>
                </div>
            </div>

            <!-- Botões -->
            <div class="actions">
                <button class="btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Limpar</button>
                <button class="btn btn-primary" id="processBtn" disabled><i class="fas fa-crop"></i> Redimensionar</button>
                <a href="/" class="btn" style="text-decoration: none;"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>

            <!-- Barra de progresso -->
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status" id="status">Aguardando vídeo...</div>

            <!-- Preview antes/depois -->
            <div class="preview" id="previewArea" style="display: none;">
                <div class="preview-box">
                    <h4>Original</h4>
                    <video id="originalVideo" controls></video>
                </div>
                <div class="preview-box">
                    <h4>Redimensionado</h4>
                    <video id="outputVideo" controls></video>
                </div>
            </div>
        </div>

        <footer>
            <p>🚀 Processamento 100% no seu navegador · nenhum vídeo sai do seu computador</p>
        </footer>
    </div>

    <!-- Carrega o FFmpeg.wasm -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
    <script>
        (function() {
            // Elementos DOM
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');
            const processBtn = document.getElementById('processBtn');
            const resetBtn = document.getElementById('resetBtn');
            const formatSelect = document.getElementById('formatSelect');
            const fitSelect = document.getElementById('fitSelect');
            const statusEl = document.getElementById('status');
            const progressFill = document.getElementById('progressFill');
            const previewArea = document.getElementById('previewArea');
            const originalVideo = document.getElementById('originalVideo');
            const outputVideo = document.getElementById('outputVideo');

            let selectedFile = null;
            let ffmpeg = null;
            let isProcessing = false;

            // Inicializa FFmpeg (carrega uma vez)
            async function loadFFmpeg() {
                if (ffmpeg) return ffmpeg;
                statusEl.innerText = 'Carregando FFmpeg...';
                const { createFFmpeg } = FFmpeg;
                ffmpeg = createFFmpeg({ 
                    log: false,
                    progress: ({ ratio }) => {
                        const percent = Math.round(ratio * 100);
                        progressFill.style.width = percent + '%';
                    }
                });
                await ffmpeg.load();
                statusEl.innerText = 'FFmpeg pronto!';
                return ffmpeg;
            }

            // Atualiza nome do arquivo
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    selectedFile = file;
                    fileName.innerText = `📹 ${file.name}`;
                    processBtn.disabled = false;
                    // Preview do original
                    const url = URL.createObjectURL(file);
                    originalVideo.src = url;
                    previewArea.style.display = 'flex';
                } else {
                    resetUpload();
                }
            });

            // Clique na área de upload
            uploadArea.addEventListener('click', () => fileInput.click());

            // Drag and drop
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#60a5fa';
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#334155';
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#334155';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('video/')) {
                    fileInput.files = e.dataTransfer.files;
                    selectedFile = file;
                    fileName.innerText = `📹 ${file.name}`;
                    processBtn.disabled = false;
                    const url = URL.createObjectURL(file);
                    originalVideo.src = url;
                    previewArea.style.display = 'flex';
                } else {
                    alert('Por favor, arrume um arquivo de vídeo válido.');
                }
            });

            // Botão reset
            resetBtn.addEventListener('click', resetUpload);

            function resetUpload() {
                selectedFile = null;
                fileInput.value = '';
                fileName.innerText = '';
                processBtn.disabled = true;
                originalVideo.src = '';
                outputVideo.src = '';
                previewArea.style.display = 'none';
                progressFill.style.width = '0%';
                statusEl.innerText = 'Aguardando vídeo...';
            }

            // Processamento
            processBtn.addEventListener('click', async () => {
                if (!selectedFile || isProcessing) return;

                try {
                    isProcessing = true;
                    processBtn.disabled = true;
                    statusEl.innerText = 'Preparando...';
                    progressFill.style.width = '0%';

                    // Carrega FFmpeg
                    const ffmpeg = await loadFFmpeg();

                    // Lê o arquivo como buffer
                    const data = await selectedFile.arrayBuffer();
                    const inputName = 'input' + selectedFile.name.substring(selectedFile.name.lastIndexOf('.'));
                    ffmpeg.FS('writeFile', inputName, new Uint8Array(data));

                    // Define proporção alvo
                    const [w, h] = formatSelect.value.split(':').map(Number);
                    const targetRatio = w / h;

                    // Obtém resolução original (precisamos rodar ffprobe? Vamos usar um truque: primeiro geramos um comando que extrai info via ffmpeg)
                    // Para simplificar, vamos redimensionar para uma largura fixa (ex: 1080) mantendo proporção e depois aplicar corte/barras.
                    // Comando complexo: podemos usar 'scale' com força de aspecto.
                    // Vamos definir resolução máxima 1080p.
                    
                    let filter;
                    if (fitSelect.value === 'cover') {
                        // Corta para preencher exatamente a proporção
                        filter = `scale=1080:1080*${targetRatio}:force_original_aspect_ratio=increase,crop=1080:1080*${targetRatio}`;
                    } else {
                        // Mantém tudo, adiciona barras (letterbox/pillarbox)
                        filter = `scale=1080:1080*${targetRatio}:force_original_aspect_ratio=decrease,pad=1080:1080*${targetRatio}:(ow-iw)/2:(oh-ih)/2`;
                    }

                    // Nome do arquivo de saída
                    const outputName = 'redimensionado_' + selectedFile.name.replace(/\.[^/.]+$/, '') + '.mp4';

                    // Executa FFmpeg
                    statusEl.innerText = 'Redimensionando...';
                    await ffmpeg.run(
                        '-i', inputName,
                        '-vf', filter,
                        '-c:v', 'libx264',
                        '-crf', '23',
                        '-preset', 'fast',
                        '-c:a', 'aac',
                        '-movflags', '+faststart',
                        '-y', outputName
                    );

                    // Lê o resultado
                    const outputData = ffmpeg.FS('readFile', outputName);
                    const outputBlob = new Blob([outputData.buffer], { type: 'video/mp4' });
                    const outputUrl = URL.createObjectURL(outputBlob);
                    outputVideo.src = outputUrl;

                    // Limpa arquivos do sistema de arquivos virtual
                    ffmpeg.FS('unlink', inputName);
                    ffmpeg.FS('unlink', outputName);

                    statusEl.innerText = 'Pronto! Clique com botão direito no vídeo para salvar.';
                    progressFill.style.width = '100%';
                } catch (error) {
                    console.error(error);
                    statusEl.innerText = 'Erro ao processar. Tente outro vídeo.';
                } finally {
                    isProcessing = false;
                    processBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
