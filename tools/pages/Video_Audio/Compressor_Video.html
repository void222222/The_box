<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thebox · Compressor de Vídeo PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 1rem 1rem 2rem;
            color: white;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.1rem;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            object-fit: cover;
            border: 4px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
            background-color: #2d1b4e;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.2rem;
            color: #cbd5e1;
        }

        .tool-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
            color: #f1f5f9;
        }

        .file-drop-area {
            border: 2px dashed #475569;
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            background: rgba(0,0,0,0.2);
            transition: border 0.2s;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        .file-drop-area:hover {
            border-color: #a855f7;
        }
        .file-drop-area i {
            font-size: 3rem;
            color: #60a5fa;
            margin-bottom: 0.8rem;
        }
        .file-drop-area p {
            color: #cbd5e1;
        }
        .file-drop-area input {
            display: none;
        }

        .compression-controls {
            background: #0f172a;
            border-radius: 24px;
            padding: 1.2rem;
            margin: 1.5rem 0;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }
        input[type=range] {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 10px;
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #a855f7;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px #a855f7;
        }

        .preview-area {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .preview-box {
            flex: 1;
            min-width: 200px;
            background: #0f172a;
            border-radius: 20px;
            padding: 1rem;
            text-align: center;
        }
        .preview-box p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 0.5rem 0 0.2rem;
        }
        .preview-box .size-number {
            font-weight: 700;
            color: #60a5fa;
        }
        video {
            max-width: 100%;
            max-height: 150px;
            border-radius: 12px;
            border: 2px solid #334155;
        }

        .btn {
            background: linear-gradient(145deg, #a855f7, #7e22ce);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn:not(:disabled):hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px #a855f7;
        }

        .download-btn {
            display: inline-block;
            background: #2563eb;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            margin-top: 1rem;
            width: 100%;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
        }
        .back-link:hover {
            color: white;
        }

        footer {
            text-align: center;
            padding: 3rem 1rem 1rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="/logo_the_box_luz_e_sombra_sem_fundo-removebg-preview.png" alt="thebox logo">
            </div>
            <h1>thebox</h1>
            <p>Compressor de Vídeo PRO</p>
        </header>

        <div class="tool-container">
            <div class="file-drop-area" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Clique para selecionar ou arraste um vídeo (MP4, MOV, WebM)</p>
                <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm" onchange="handleVideoUpload(event)">
            </div>

            <div id="compressionPanel" style="display: none;">
                <div class="compression-controls">
                    <div class="slider-label">
                        <span>Qualidade (taxa de bits)</span>
                        <span id="qualityLabel">1500 kbps</span>
                    </div>
                    <input type="range" id="qualitySlider" min="0" max="100" value="40" oninput="updateQualityLabel()">
                </div>

                <div class="preview-area">
                    <div class="preview-box">
                        <video id="originalPreview" controls></video>
                        <p>Original</p>
                        <span id="originalSize" class="size-number">0 KB</span>
                    </div>
                    <div class="preview-box">
                        <video id="compressedPreview" controls style="display:none;"></video>
                        <p>Comprimido</p>
                        <span id="compressedSize" class="size-number">—</span>
                    </div>
                </div>

                <button class="btn" id="compressBtn" onclick="compressVideo()">Comprimir vídeo</button>
                <a id="downloadLink" class="download-btn" style="display:none;" download="video_comprimido.mp4">⬇ Baixar vídeo comprimido (MP4)</a>
            </div>

            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Voltar para o início</a>
        </div>

        <footer>
            <p>🚀 thebox — ferramentas gratuitas</p>
        </footer>
    </div>

    <script>
        // Inicializa o FFmpeg
        const { createFFmpeg, fetchFile } = FFmpeg;
        // log: true ajuda a ver o processo no console do navegador (F12)
        const ffmpeg = createFFmpeg({ log: true });

        const fileInput = document.getElementById('fileInput');
        const panel = document.getElementById('compressionPanel');
        const originalVideo = document.getElementById('originalPreview');
        const compressedVideo = document.getElementById('compressedPreview');
        const originalSizeSpan = document.getElementById('originalSize');
        const compressedSizeSpan = document.getElementById('compressedSize');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityLabel = document.getElementById('qualityLabel');
        const compressBtn = document.getElementById('compressBtn');
        const downloadLink = document.getElementById('downloadLink');

        let currentFile = null;

        function updateQualityLabel() {
            const val = parseInt(qualitySlider.value);
            // Mapeia 0-100 para 100kbps a 5000kbps
            const bitrate = Math.round(100 + (val / 100) * 4900); 
            qualityLabel.innerText = bitrate + ' kbps';
        }

        function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            currentFile = file;

            const url = URL.createObjectURL(file);
            originalVideo.src = url;
            originalSizeSpan.innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB'; // Mudei para MB para facilitar
            
            panel.style.display = 'block';
            compressBtn.disabled = false;
            compressBtn.innerText = 'Comprimir vídeo';
            downloadLink.style.display = 'none';
            compressedVideo.style.display = 'none';
            compressedSizeSpan.innerText = '—';
        }

        async function compressVideo() {
            if (!currentFile) return;

            try {
                compressBtn.disabled = true;
                compressBtn.innerText = 'Iniciando motor FFmpeg... (Pode demorar na 1ª vez)';

                // Carrega o núcleo do FFmpeg (pesa cerca de 25MB, por isso demora um pouco na primeira vez)
                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                compressBtn.innerText = 'Processando vídeo... Aguarde!';

                // Pega o valor do slider e calcula o bitrate
                const val = parseInt(qualitySlider.value);
                const bitrate = Math.round(100 + (val / 100) * 4900); 
                const bitrateStr = `${bitrate}k`;

                // Coloca o arquivo na memória virtual do navegador
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(currentFile));

                // RODA O COMANDO MAGICO DO FFMPEG
                // -i (input), -b:v (bitrate do video), -preset ultrafast (para ser rápido no navegador)
                await ffmpeg.run('-i', 'input.mp4', '-b:v', bitrateStr, '-preset', 'ultrafast', 'output.mp4');

                // Lê o resultado da memória virtual
                const data = ffmpeg.FS('readFile', 'output.mp4');

                // Cria o arquivo final e disponibiliza pro usuário
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                compressedVideo.src = url;
                compressedVideo.style.display = 'block';
                compressedSizeSpan.innerText = (blob.size / (1024 * 1024)).toFixed(2) + ' MB';
                
                downloadLink.href = url;
                downloadLink.style.display = 'block';
                compressBtn.innerText = 'Compressão Concluída!';

            } catch (err) {
                console.error('Erro na compressão:', err);
                alert('Ocorreu um erro ao comprimir. Verifique o console.');
                compressBtn.innerText = 'Erro. Tente novamente.';
                compressBtn.disabled = false;
            }
        }

        // Sistema de Arrastar e Soltar
        const dropArea = document.querySelector('.file-drop-area');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file && file.type.startsWith('video/')) {
                fileInput.files = dt.files;
                handleVideoUpload({ target: { files: [file] } });
            } else {
                alert('Por favor, solte um arquivo de vídeo válido.');
            }
        });
    </script>
</body>
</html>
