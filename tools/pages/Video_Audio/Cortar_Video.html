<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortar Vídeo · thebox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Headers de segurança para SharedArrayBuffer (necessário para FFmpeg) -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #e2e8f0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 40px -12px black;
        }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0,0,0,0.2);
            margin-bottom: 1.5rem;
        }
        .upload-area:hover {
            border-color: #ef4444;
        }
        .upload-area i {
            font-size: 3rem;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }
        .upload-area p {
            color: #94a3b8;
        }
        #videoFile {
            display: none;
        }
        .video-wrapper {
            margin: 1.5rem 0;
        }
        .video-wrapper video {
            width: 100%;
            border-radius: 20px;
            background: #0b1120;
            max-height: 300px;
        }
        .mode-selector {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 1.5rem 0;
            background: #0f172a;
            padding: 1rem;
            border-radius: 40px;
        }
        .mode-selector label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            cursor: pointer;
        }
        .mode-selector input[type="radio"] {
            accent-color: #ef4444;
            width: 18px;
            height: 18px;
        }
        .timeline-container {
            margin-top: 1.5rem;
        }
        .time-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }
        .timeline-bar {
            position: relative;
            width: 100%;
            height: 60px;
            background: #1e293b;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px 0 30px;
            border: 1px solid #334155;
        }
        .timeline-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f97316);
            border-radius: 30px;
            pointer-events: none;
            opacity: 0.3;
        }
        .playhead {
            position: absolute;
            width: 4px;
            height: 100%;
            background: white;
            border-radius: 2px;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 5;
        }
        .marker {
            position: absolute;
            width: 20px;
            height: 80px;
            background: #ef4444;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            user-select: none;
        }
        .marker.start {
            background: #10b981;
        }
        .marker.end {
            background: #ef4444;
        }
        .marker span {
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 11px;
        }
        .info-box {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 1rem;
            border-radius: 30px;
            margin: 1rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .info-box div {
            color: #cbd5e1;
        }
        .info-box i {
            color: #ef4444;
            margin-right: 0.3rem;
        }
        .progress-area {
            margin: 1rem 0;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #f97316);
            transition: width 0.3s ease;
        }
        .status {
            text-align: center;
            color: #94a3b8;
            margin: 0.5rem 0;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fecaca;
            padding: 0.8rem;
            border-radius: 20px;
            margin: 1rem 0;
        }
        #processBtn {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin: 1rem 0;
        }
        #processBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px #ef4444;
        }
        #processBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .download-link {
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: 0.2s;
            margin-top: 1rem;
        }
        .download-link:hover {
            background: #059669;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #64748b;
        }
        .warning {
            background: #f59e0b20;
            border: 1px solid #f59e0b;
            color: #fcd34d;
            padding: 1rem;
            border-radius: 20px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✂️ Cortar Vídeo</h1>
            <p>Selecione um trecho e escolha: extrair ou remover.</p>
        </header>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Clique para selecionar um vídeo</p>
            </div>
            <input type="file" id="videoFile" accept="video/*">

            <div class="video-wrapper" id="videoWrapper" style="display: none;">
                <video id="videoPreview" controls></video>
            </div>

            <!-- Seletor de modo: Extrair ou Remover -->
            <div class="mode-selector" id="modeSelector" style="display: none;">
                <label>
                    <input type="radio" name="mode" value="extract" checked> <i class="fas fa-scissors"></i> Extrair trecho (salvar só a seleção)
                </label>
                <label>
                    <input type="radio" name="mode" value="remove"> <i class="fas fa-cut"></i> Remover trecho (deletar a seleção e juntar o resto)
                </label>
            </div>

            <div class="timeline-container" id="timelineContainer" style="display: none;">
                <div class="time-indicator">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <div class="timeline-bar" id="timelineBar">
                    <div class="timeline-fill" id="timelineFill" style="width: 0%;"></div>
                    <div class="playhead" id="playhead" style="left: 0%;"></div>
                    <div class="marker start" id="markerStart">
                        <span id="startLabel">0s</span>
                    </div>
                    <div class="marker end" id="markerEnd">
                        <span id="endLabel">0s</span>
                    </div>
                </div>

                <div class="info-box">
                    <div><i class="fas fa-play"></i> Início: <span id="startValue">0.0s</span></div>
                    <div><i class="fas fa-stop"></i> Fim: <span id="endValue">0.0s</span></div>
                    <div><i class="fas fa-cut"></i> Duração: <span id="durationValue">0.0s</span></div>
                </div>

                <div class="progress-area" id="progressArea" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="status" id="status"></div>
                </div>

                <div id="errorContainer" class="error-message" style="display: none;"></div>
                <div id="warningContainer" class="warning" style="display: none;"></div>

                <button id="processBtn"><i class="fas fa-cut"></i> Processar</button>
                <a id="downloadLink" class="download-link"><i class="fas fa-download"></i> Baixar vídeo</a>
            </div>
        </div>

        <footer>
            <p>🔧 Processamento 100% local. Para funcionar, abra esta página com um servidor local (ex: Live Server).</p>
        </footer>
    </div>

    <!-- Carregar FFmpeg via jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
    <script>
        (function() {
            // Verificação de suporte a SharedArrayBuffer
            if (typeof SharedArrayBuffer === 'undefined') {
                document.getElementById('warningContainer').style.display = 'block';
                document.getElementById('warningContainer').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Seu navegador não suporta SharedArrayBuffer. Isso é necessário para o FFmpeg. Por favor, abra esta página usando um servidor local (ex: Live Server do VS Code) ou utilize um navegador como Chrome/Edge com as flags corretas.';
            }

            // Elementos DOM
            const uploadArea = document.getElementById('uploadArea');
            const videoFileInput = document.getElementById('videoFile');
            const videoWrapper = document.getElementById('videoWrapper');
            const videoPreview = document.getElementById('videoPreview');
            const modeSelector = document.getElementById('modeSelector');
            const timelineContainer = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            const markerStart = document.getElementById('markerStart');
            const markerEnd = document.getElementById('markerEnd');
            const playhead = document.getElementById('playhead');
            const timelineFill = document.getElementById('timelineFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const durationSpan = document.getElementById('duration');
            const startLabel = document.getElementById('startLabel');
            const endLabel = document.getElementById('endLabel');
            const startValue = document.getElementById('startValue');
            const endValue = document.getElementById('endValue');
            const durationValue = document.getElementById('durationValue');
            const processBtn = document.getElementById('processBtn');
            const progressArea = document.getElementById('progressArea');
            const progressFill = document.getElementById('progressFill');
            const statusDiv = document.getElementById('status');
            const errorContainer = document.getElementById('errorContainer');
            const downloadLink = document.getElementById('downloadLink');
            const modeRadios = document.querySelectorAll('input[name="mode"]');

            let videoFile = null;
            let videoDuration = 0;
            let ffmpeg = null;
            let isDragging = false;
            let activeMarker = null;

            // ---------- Upload ----------
            uploadArea.addEventListener('click', () => videoFileInput.click());
            uploadArea.addEventListener('dragover', (e) => e.preventDefault());
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('video/')) handleVideo(file);
                else showError('Por favor, selecione um vídeo válido.');
            });
            videoFileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) handleVideo(e.target.files[0]);
            });

            function handleVideo(file) {
                videoFile = file;
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoWrapper.style.display = 'block';
                modeSelector.style.display = 'flex';
                timelineContainer.style.display = 'block';
                downloadLink.style.display = 'none';
                errorContainer.style.display = 'none';
                processBtn.disabled = false;

                videoPreview.onloadedmetadata = () => {
                    videoDuration = videoPreview.duration;
                    durationSpan.textContent = formatTime(videoDuration);
                    // Inicializa marcadores: início = 0, fim = duração total
                    updateMarkerPositions(0, videoDuration);
                    // Atualiza playhead conforme o vídeo toca
                    videoPreview.ontimeupdate = () => {
                        if (!isDragging) {
                            const percent = (videoPreview.currentTime / videoDuration) * 100;
                            playhead.style.left = percent + '%';
                            currentTimeSpan.textContent = formatTime(videoPreview.currentTime);
                        }
                    };
                };
            }

            // ---------- Timeline e marcadores arrastáveis ----------
            function updateMarkerPositions(startSec, endSec) {
                // Limita aos limites
                startSec = Math.max(0, Math.min(startSec, videoDuration));
                endSec = Math.max(startSec, Math.min(endSec, videoDuration));

                const startPercent = (startSec / videoDuration) * 100;
                const endPercent = (endSec / videoDuration) * 100;

                markerStart.style.left = startPercent + '%';
                markerEnd.style.left = endPercent + '%';

                // Atualiza labels e textos
                startLabel.textContent = startSec.toFixed(1) + 's';
                endLabel.textContent = endSec.toFixed(1) + 's';
                startValue.textContent = startSec.toFixed(1) + 's';
                endValue.textContent = endSec.toFixed(1) + 's';
                durationValue.textContent = (endSec - startSec).toFixed(1) + 's';

                // Preenche a área entre os marcadores
                timelineFill.style.left = startPercent + '%';
                timelineFill.style.width = (endPercent - startPercent) + '%';
            }

            // Detectar início do arrasto
            markerStart.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
                activeMarker = 'start';
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
            });
            markerEnd.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
                activeMarker = 'end';
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
            });

            function onDrag(e) {
                if (!isDragging || !activeMarker) return;
                const rect = timelineBar.getBoundingClientRect();
                let x = e.clientX - rect.left;
                x = Math.max(0, Math.min(x, rect.width));
                const percent = (x / rect.width) * 100;
                let newTime = (percent / 100) * videoDuration;

                if (activeMarker === 'start') {
                    // Não pode passar do fim
                    const currentEnd = parseFloat(endLabel.textContent);
                    if (newTime < currentEnd) {
                        updateMarkerPositions(newTime, currentEnd);
                    }
                } else if (activeMarker === 'end') {
                    const currentStart = parseFloat(startLabel.textContent);
                    if (newTime > currentStart) {
                        updateMarkerPositions(currentStart, newTime);
                    }
                }
            }

            function stopDrag() {
                isDragging = false;
                activeMarker = null;
                document.removeEventListener('mousemove', onDrag);
                document.removeEventListener('mouseup', stopDrag);
            }

            // Clique na timeline move o playhead
            timelineBar.addEventListener('click', (e) => {
                const rect = timelineBar.getBoundingClientRect();
                let x = e.clientX - rect.left;
                x = Math.max(0, Math.min(x, rect.width));
                const percent = (x / rect.width) * 100;
                const newTime = (percent / 100) * videoDuration;
                videoPreview.currentTime = newTime;
            });

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // ---------- Processamento com FFmpeg ----------
            async function loadFFmpeg() {
                if (ffmpeg) return true;
                statusDiv.innerText = 'Carregando FFmpeg...';
                progressArea.style.display = 'block';
                progressFill.style.width = '10%';
                try {
                    const { createFFmpeg } = FFmpeg;
                    ffmpeg = createFFmpeg({ 
                        log: true,
                        corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
                    });
                    await ffmpeg.load();
                    progressFill.style.width = '50%';
                    statusDiv.innerText = 'FFmpeg pronto.';
                    return true;
                } catch (error) {
                    console.error(error);
                    showError('Erro ao carregar FFmpeg. Verifique se está usando um servidor local.');
                    return false;
                }
            }

            processBtn.addEventListener('click', async () => {
                if (!videoFile) return;

                const start = parseFloat(startLabel.textContent);
                const end = parseFloat(endLabel.textContent);
                if (end <= start) {
                    showError('O fim deve ser maior que o início.');
                    return;
                }

                const mode = document.querySelector('input[name="mode"]:checked').value;

                processBtn.disabled = true;
                progressArea.style.display = 'block';
                statusDiv.innerText = 'Preparando...';
                progressFill.style.width = '0%';
                errorContainer.style.display = 'none';

                // Carrega FFmpeg se necessário
                if (!ffmpeg) {
                    const loaded = await loadFFmpeg();
                    if (!loaded) {
                        processBtn.disabled = false;
                        return;
                    }
                }

                try {
                    // Escrever arquivo no sistema virtual
                    const data = new Uint8Array(await videoFile.arrayBuffer());
                    ffmpeg.FS('writeFile', 'input.mp4', data);

                    statusDiv.innerText = mode === 'extract' ? 'Extraindo trecho...' : 'Removendo trecho...';
                    progressFill.style.width = '20%';

                    if (mode === 'extract') {
                        // Extrair trecho: -ss start -i input -to end -c copy output.mp4
                        const duration = (end - start).toFixed(3);
                        await ffmpeg.run('-ss', start.toString(), '-i', 'input.mp4', '-to', end.toString(), '-c', 'copy', 'output.mp4');
                    } else {
                        // Remover trecho: precisamos de duas partes e concatenar
                        // Parte 1: do início até start (se start > 0)
                        // Parte 2: de end até o fim (se end < duração)
                        // Depois juntar com concat
                        const files = [];
                        if (start > 0) {
                            await ffmpeg.run('-ss', '0', '-i', 'input.mp4', '-to', start.toString(), '-c', 'copy', 'part1.mp4');
                            files.push('part1.mp4');
                        }
                        if (end < videoDuration) {
                            await ffmpeg.run('-ss', end.toString(), '-i', 'input.mp4', '-c', 'copy', 'part2.mp4');
                            files.push('part2.mp4');
                        }

                        if (files.length === 0) {
                            // Nenhuma parte restante (selecionou o vídeo inteiro) -> arquivo vazio? ou erro
                            showError('O trecho selecionado cobre o vídeo inteiro. Nada restou.');
                            processBtn.disabled = false;
                            return;
                        } else if (files.length === 1) {
                            // Apenas uma parte, basta renomear
                            ffmpeg.FS('rename', files[0], 'output.mp4');
                        } else {
                            // Concatena duas partes
                            // Criar arquivo de lista
                            const listContent = files.map(f => `file '${f}'`).join('\n');
                            ffmpeg.FS('writeFile', 'list.txt', listContent);
                            await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp4');
                        }
                    }

                    progressFill.style.width = '80%';
                    statusDiv.innerText = 'Finalizando...';

                    const outputData = ffmpeg.FS('readFile', 'output.mp4');
                    const blob = new Blob([outputData.buffer], { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);

                    downloadLink.href = url;
                    downloadLink.download = `cortado_${Date.now()}.mp4`;
                    downloadLink.style.display = 'flex';
                    progressFill.style.width = '100%';
                    statusDiv.innerText = 'Concluído!';
                    setTimeout(() => progressArea.style.display = 'none', 1000);
                } catch (error) {
                    console.error(error);
                    showError('Erro ao processar: ' + error.message);
                } finally {
                    processBtn.disabled = false;
                }
            });

            function showError(msg) {
                errorContainer.textContent = msg;
                errorContainer.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
