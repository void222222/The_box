<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortar Vídeo · thebox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Headers de segurança para SharedArrayBuffer -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <!--LINK_CSS-->
    <link rel="stylesheet" href="../../../css/pages/Video_Audio/Cortar_Video.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✂️ Cortar Vídeo</h1>
            <p>Arraste os marcadores, defina o trecho e baixe o corte real.</p>
        </header>

        <div class="card" id="card">
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Clique para selecionar um vídeo</p>
            </div>
            <input type="file" id="videoFile" accept="video/*">

            <div class="video-wrapper" id="videoWrapper" style="display: none;">
                <video id="videoPreview" controls></video>
            </div>

            <div class="timeline-container" id="timelineContainer" style="display: none;">
                <div class="time-indicator">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <div class="timeline-bar" id="timelineBar">
                    <div class="timeline-fill" id="timelineFill" style="width: 0%;"></div>
                    <div class="playhead" id="playhead" style="left: 0%;"></div>
                    <div class="marker start" id="markerStart">
                        <span id="startLabel">0s</span>
                    </div>
                    <div class="marker end" id="markerEnd">
                        <span id="endLabel">0s</span>
                    </div>
                </div>

                <div class="info-box">
                    <div><i class="fas fa-play"></i> Início: <span id="startValue">0.0s</span></div>
                    <div><i class="fas fa-stop"></i> Fim: <span id="endValue">0.0s</span></div>
                    <div><i class="fas fa-cut"></i> Duração: <span id="durationValue">0.0s</span></div>
                </div>

                <div class="progress-area" id="progressArea" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="status" id="status"></div>
                </div>

                <div id="errorContainer" class="error-message" style="display: none;"></div>

                <button id="processBtn"><i class="fas fa-cut"></i> Cortar e Baixar</button>
                <a id="downloadLink" class="download-link"><i class="fas fa-download"></i> Baixar vídeo cortado</a>
            </div>
        </div>

        <footer>
            <p>🔧 Processamento 100% local. O vídeo não sai do seu computador.</p>
        </footer>
    </div>

    <!-- Carregar FFmpeg via jsDelivr -->
    <script src="/ffmpeg/ffmpeg.min.js"></script>
    <script src="../../../js/pages/Video_Audio/Cortar_Video.js"></script>
</body>
</html>
